name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 (Tag)'
        required: false
        default: 'latest'
        type: string
  workflow_call:
    inputs:
      tag:
        description: '镜像标签 (Tag)'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: microsoft-rewards-script

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout V4-china 分支源码
        uses: actions/checkout@v4
        with:
          repository: chiihero/Microsoft-Rewards-Script
          ref: V4-china
          path: source

      - name: 获取源码提交短 SHA
        id: source_sha
        shell: bash
        run: |
          SHA=$(git -C source rev-parse --short HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Source commit: ${SHA}"

      - name: 读取 package.json 版本号
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./source/package.json').version")
          if [ -z "$VERSION" ]; then
            echo "❌ 未能从 package.json 读取 version 字段"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像引用
        id: image
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          echo "ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_REF}"

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:${{ steps.pkg.outputs.version }}
            ${{ steps.image.outputs.ref }}:v${{ steps.pkg.outputs.version }}
            ${{ steps.image.outputs.ref }}:${{ inputs.tag }}
            ${{ steps.image.outputs.ref }}:sha-${{ steps.source_sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/chiihero/Microsoft-Rewards-Script
            org.opencontainers.image.revision=${{ steps.source_sha.outputs.sha }}
            org.opencontainers.image.version=${{ steps.pkg.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出构建摘要
        shell: bash
        run: |
          {
            echo "## 🐳 镜像已推送到 GHCR"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${{ steps.image.outputs.ref }}\` |"
            echo "| Package 版本 | \`${{ steps.pkg.outputs.version }}\` |"
            echo "| 手动 Tag | \`${{ inputs.tag }}\` |"
            echo "| 源码提交 | \`sha-${{ steps.source_sha.outputs.sha }}\` |"
            echo ""
            echo "### 拉取命令"
            echo '```bash'
            echo "docker pull ${{ steps.image.outputs.ref }}:${{ steps.pkg.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"